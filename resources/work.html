<html>
  <body>

    <h1>{{ .GetTitle }}</h1>

    {{ range .Contents }}

      <!-- TODO: pass in ContentTypes through HtmlEnvironment -->
      {{ if eq .GetType.SingularString "text" }}
        <p>
          {{ .ToHtml }}
        </p>
      {{ else }}
        {{ .ToHtml }}
      {{ end }}

    {{ end }}

  </body>
</html>
