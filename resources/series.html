<html>
  <body>

    <h1>{{ .GetTitle }}</h1>

    <table>
      <tr style="text-align: left">
        <th>Time required</th>
        <th>Title</th>
      </tr>
      {{ range .Listings }}
      <tr>
        <td>{{ formatTime .GetTimeRequiredMinutes }}</td>
        <td><a href="{{ .GetNumberingUrlString }}">{{ .GetTitle }}</a></td>
      </tr>
      {{ end }}
    </table>

  </body>
</html>
