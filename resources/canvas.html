<html>
  <head>
    <link rel="stylesheet" href="/static/canvas.css">
    <link rel="stylesheet" href="/static/work.css">
    <link rel="stylesheet" href="/static/style.css">
  </head>

  <body>
    
    <!-- WorkEditing is passed in-->
    
    <form method="post" enctype="multipart/form-data" class="aside-with-main-canvas">
      
      <aside>
        <fieldset>
          
          {{ if eq $.Editing true }}
          <menu>
            <li>
              <button type="submit" name="action" value="add-text:{{ .Work.GetId }}">
                & new text
              </button>
            </li>
            
            <li>
              <button type="submit" name="action" value="add-media:{{ .Work.GetId }}">
                & new media
              </button>
            </li>
          </menu>

          <button type="submit" name="action" value="view-work:">
            view work
          </button>

          <input type="hidden" name="editing" value="true">
          {{ else }}
          <button type="submit" name="action" value="edit-work:">
            compose work
          </button>

          <input type="hidden" name="editing" value="false">
          {{ end }}

        </fieldset>
      </aside>

      <main>
        {{ if eq $.Editing true }}
        {{ .Work.ToEditableHtml }}
        {{ else }}
        {{ .Work.ToHtml }}
        {{ end }}
      </main>
  
    </form>

    <script>
      document.querySelector('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const formData = new FormData(e.target);
        
        const submitter = e.submitter;
        if (submitter && submitter.name) {
          formData.append(submitter.name, submitter.value);
        }
        
        try {
          const response = await fetch(window.location.href, {
            method: 'POST',
            body: formData
          });
          
          if (response.ok) {
            const html = await response.text();
            document.open();
            document.write(html);
            document.close();
          } else {
            console.error('Form submission failed:', response.status);
          }
        } catch (error) {
          console.error('Error submitting form:', error);
        }
      });
    </script>
  </body>
</html>
