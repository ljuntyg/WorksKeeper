<html>
  <body>

    <!-- *Work is passed in-->

    <form method="post" enctype="multipart/form-data">

      <h1>
        <textarea name="title-text">
          {{ .GetTitle }}
        </textarea>
      </h1>
  
      <section>
        {{ range .Contents }}
        <fieldset>
          <legend>
            <button type="submit" name="action" value="move-up:{{ .GetId }}">
              ↑
            </button>

            <button type="submit" name="action" value="move-down:{{ .GetId }}">
              ↓
            </button>
            
            <button type="submit" name="action" value="delete-content:{{ .GetId }}">
              ✕
            </button>
          </legend>
          
          {{ .ToEditableHtml }}
        </fieldset>
        {{ end }}
      </section>
  
      <aside>
        <fieldset>
          <legend>
            Compose work
          </legend>

          <button type="submit" name="action" value="add-text:{{ .GetId }}">
            &
          </button>

          with text<br>

          <button type="submit" name="action" value="add-media:{{ .GetId }}">
            &
          </button>

          with sound, video or image

          <!-- <fieldset>
            <legend>
              with sound, video or image

              <button type="submit" name="action" value="upload:{{ .GetId }}">
                upload
              </button>
            </legend>
            
            <input type="file" name="upload" />
          </fieldset> -->

        </fieldset>
      </aside>
    </form>
  </body>
</html>
