<html>
  <body>

    <!-- *ListingsAddedN is passed in -->

    <a href="/compose/work">Submit work</a>

    
    <form method="post">

      <table>
        <tr style="text-align: left">
          <th>Time required</th>
          <th>Title</th>
        </tr>

        {{ range .Listings }}
        {{ $numberingString := .GetNumberingUrlString }}
        <tr>
          <td>{{ formatTime .GetTimeRequiredMinutes }}</td>
          <td><a href="{{ $numberingString }}">{{ .GetTitle }}</a></td>

          <input type="hidden" name="listing-numberings" value="{{ $numberingString }}">
        </tr>
        {{ end }}
      </table>
      
      {{ if and (lt (len .Listings) 15) (eq .HasMore true) }}
      <menu>
        <li>
          <button type="submit" name="action" value="more-works:">
            & more
          </button>
        </li>
      </menu>
      {{ else }}
      <a href="/search/works">Search works</a>
      {{ end }}

    </form>
    
    
    <script>
      document.querySelector('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const formData = new FormData(e.target);
        
        const submitter = e.submitter;
        if (submitter && submitter.name) {
          formData.append(submitter.name, submitter.value);
        }
        
        try {
          const response = await fetch(window.location.href, {
            method: 'POST',
            body: formData
          });
          
          if (response.ok) {
            const html = await response.text();
            document.open();
            document.write(html);
            document.close();
          } else {
            console.error('Form submission failed:', response.status);
          }
        } catch (error) {
          console.error('Error submitting form:', error);
        }
      });
    </script>
  </body>
</html>
