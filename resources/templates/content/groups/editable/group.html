<!-- TemplateGroup is passed in -->
<fieldset>
  <legend>
    <button type="submit" name="action" value="delete-group:{{ $.Group.Id }}">
      ✕
    </button>

    <button type="submit" name="action" value="group-neg-dir:{{ $.Group.Id }}">
      -
    </button>

    <button type="submit" name="action" value="group-pos-dir:{{ $.Group.Id }}">
      +
    </button>
  </legend>

  {{ range $.Templatables }}
  {{ .ToEditableHtml }}
  {{ end }}

  <menu>
    <li>
      <button type="submit" name="action" value="add-text:{{ $.Group.Id }}">
        & new text
      </button>
    </li>
    
    <li>
      <button type="submit" name="action" value="add-media:{{ $.Group.Id }}">
        & new media
      </button>
    </li>

    <li>
      <button type="submit" name="action" value="add-group:{{ $.Group.Id }}">
        & new group
      </button>
    </li>
  </menu>
</fieldset>
