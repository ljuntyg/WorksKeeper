<!doctype html>
<html>
  <!-- <head>
    <link rel="stylesheet" href="/static/home.css">
    <link rel="stylesheet" href="/static/style.css">
  </head> -->

  <body>
    <form method="post">
      <div class="main-container">

        <nav class="nav-container">
          <a href="/compose/work">create</a>
        </nav>
  
        <main class="table-container">
          <table>
            <tr>
              <th>length</th>
              <th>title</th>
              <!-- <th>about</th> -->
            </tr>
    
            {{ range $ }}
            {{ $numberingString := .GetNumberingUrlString }}
            <tr>
              <td>{{ .GetTimeRequiredString }}</td>
              <td>
                <a href="{{ $numberingString }}">{{ .GetTitle }}</a>
              </td>
              <!-- <td>
                <details>
                  <summary></summary>
                  TODO: Description/Summary
                  TODO: Remember if open/closed on post
                </details>
              </td> -->
    
              <input type="hidden" name="listing-numberings" value="{{ $numberingString }}">
            </tr>
            {{ end }}
          </table>
        </main>

      </div>
    </form>
    
    <script>
      document.querySelector('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const formData = new FormData(e.target);
        
        const submitter = e.submitter;
        if (submitter && submitter.name) {
          formData.append(submitter.name, submitter.value);
        }
        
        try {
          const response = await fetch(window.location.href, {
            method: 'POST',
            body: formData
          });
          
          if (response.ok) {
            const html = await response.text();
            const scrollY = window.scrollY;
            document.open();
            document.write(html);
            document.close();
            window.scrollTo(0, scrollY);
          } else {
            console.error('Form submission failed:', response.status);
          }
        } catch (error) {
          console.error('Error submitting form:', error);
        }
      });
    </script>
  </body>
</html>
